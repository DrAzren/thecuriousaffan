<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#3b8de8;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
// Cat breed sheet: all breeds sitting (t=0), 3/4 view (t=1), side (t=2), standing/walking (t=3), meow + blink (t=4)
import * as THREE from 'three';
import { makeRenderer } from '/shared/core.js';
import { makeCat, BREEDS } from '/shared/cat.js';
import { makeAffan } from '/shared/affan.js';
const r = makeRenderer(document.getElementById('c'));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x4a9cf0);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6a5a80, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3,6,8); key.castShadow=true; key.shadow.bias=-0.0004; key.shadow.normalBias=0.03; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd8ff, 1.5); rim.position.set(-6,4,-6); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8fc0f0 })); ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const names = Object.keys(BREEDS);
const cats = names.map((n, i) => { const c = makeCat(BREEDS[n], { seed: i + 1 }); c.root.position.set((i - 3) * 2.2, 0, 0); scene.add(c.root); return c; });
const A = makeAffan(); A.root.position.set(8.6, 0, -1); scene.add(A.root);
const cam = new THREE.PerspectiveCamera(30, 1080/1920, 0.05, 100);
const views = [
 (t) => { cats.forEach(c => { c.root.rotation.y = 0; c.pose({ t, sit: 1 }); }); cam.position.set(0, 5, 26); cam.lookAt(0, 0.4, -1); },
 (t) => { cats.forEach(c => { c.root.rotation.y = 0.7; c.pose({ t, sit: 1, headYaw: -0.4 }); }); cam.position.set(0, 5, 26); cam.lookAt(0, 0.4, -1); },
 (t) => { cats.forEach(c => { c.root.rotation.y = Math.PI/2; c.pose({ t, sit: 1 }); }); cam.position.set(0, 5, 26); cam.lookAt(0, 0.4, -1); },
 (t) => { cats.forEach(c => { c.root.rotation.y = 1.2; c.pose({ t, sit: 0, walk: t * 6 }); }); cam.position.set(-4.4, 1.6, 5); cam.lookAt(-4.4, 0.6, 0); },
 (t) => { cats.forEach(c => { c.root.rotation.y = 0; c.pose({ t, sit: 1, meow: 1, headPitch: -0.3, blink: 0.5 }); }); cam.position.set(0, 5, 26); cam.lookAt(0, 0.4, -1); },
];
for (let i = 0; i < 7; i++) views.push((t) => { cats.forEach(c => { c.root.rotation.y = 0.35; c.pose({ t, sit: 1, headYaw: -0.2 }); }); const p = cats[i].root.position; const h = cats[i].breed.size; cam.position.set(p.x, 1.1 * h, p.z + 4.2 * h); cam.lookAt(p.x, 0.72 * h, p.z); });
window.EP = { fps: 30, duration: 12, ready: Promise.resolve(), frame(t){ views[Math.floor(t)%views.length](t); r.render(scene, cam); } };
</script></body></html>
